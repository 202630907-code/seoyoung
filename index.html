<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 먹을 저녁 메뉴 추천</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 15px;
            margin-bottom: 35px;
        }

        .display-card {
            background: #fff8f0;
            border: 2px dashed #ffe0b2;
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 30px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .emoji {
            font-size: 80px;
            line-height: 1;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }

        .menu-name {
            font-size: 24px;
            font-weight: 700;
            color: #e67e22;
        }

        .btn {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 126, 95, 0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(255, 126, 95, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(255, 126, 95, 0.3);
        }

        /* 애니메이션 효과 */
        .bounce {
            animation: bounce 0.4s ease;
        }

        @keyframes bounce {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍽️ 오늘 뭐 먹지?</h1>
        <p class="subtitle">결정 장애를 위한 저녁 메뉴 추천 시스템</p>

        <div class="display-card" id="card">
            <div class="emoji" id="emoji">❓</div>
            <div class="menu-name" id="menu">버튼을 눌러보세요!</div>
        </div>

        <button class="btn" onclick="recommendMenu()">저녁 메뉴 추천</button>
    </div>

    <script>
        // 메뉴 목록 (이모지 & 음식명)
        const menuList = [
            { name: "삼겹살", emoji: "🥓" },
            { name: "치킨", emoji: "🍗" },
            { name: "피자", emoji: "🍕" },
            { name: "초밥", emoji: "🍣" },
            { name: "떡볶이", emoji: "🥘" },
            { name: "짜장면", emoji: "🍜" },
            { name: "햄버거", emoji: "🍔" },
            { name: "돈까스", emoji: "🍱" },
            { name: "김치찌개", emoji: "🍲" },
            { name: "족발/보쌈", emoji: "🍖" },
            { name: "파스타", emoji: "🍝" },
            { name: "카레", emoji: "🍛" },
            { name: "스테이크", emoji: "🥩" },
            { name: "타코", emoji: "🌮" },
            { name: "쌀국수", emoji: "🍜" },
            { name: "곱창/막창", emoji: "🥘" }
        ];

        function recommendMenu() {
            const emojiEl = document.getElementById("emoji");
            const menuEl = document.getElementById("menu");

            // 애니메이션 초기화
            emojiEl.classList.remove("bounce");
            menuEl.classList.remove("bounce");

            // 랜덤 인덱스 추출
            const randomIndex = Math.floor(Math.random() * menuList.length);
            const selected = menuList[randomIndex];

            // 잠깐의 딜레이 후 결과 보여주기 (애니메이션 재적용)
            setTimeout(() => {
                emojiEl.textContent = selected.emoji;
                menuEl.textContent = selected.name;

                emojiEl.classList.add("bounce");
                menuEl.classList.add("bounce");
            }, 50);
        }
    </script>

</body>
</html>ㅓㅕ
